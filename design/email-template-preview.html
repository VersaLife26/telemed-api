<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VersaLife email preview</title>
  <style>
    body { margin: 0; background: #dde8f0; font-family: system-ui, sans-serif; }
    .toolbar { padding: 12px 20px; background: #015591; color: #fff; font-size: 14px; }
  </style>
</head>
<body>
  <div class="toolbar">Static preview — same layout as SMTP HTML (open this file in a browser).</div>
  <!-- Generated by EmailHtmlLayout; sample: booking confirmed -->
  <iframe srcdoc="REPLACE" style="width:100%;min-height:720px;border:0;"></iframe>
  <script>
    // Inline sample from NotificationTemplates booking_confirmed (English)
    const subject = "Your appointment with Dr. Nimal Perera is confirmed";
    const body = "Your appointment with Dr. Nimal Perera is confirmed for 01 Oct 2026, 10:00.\n\nFee: Rs. 2,500.00\n\nYou will receive the link to join shortly before your appointment time.";
    const brand = { product: "VersaLife Health", headerLogo: "../telemed-frontend/public/assets/logo-email.png", markLogo: "../telemed-frontend/public/assets/logo-mark-email.png", app: "https://versalifehealth.com" };
    const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const paras = body.split(/\n\n+/).map(p => `<p style="margin:0 0 16px;">${esc(p).replace(/\n/g,"<br />")}</p>`).join("");
    const cta = `<table role="presentation" cellspacing="0" cellpadding="0" style="border-collapse:separate;"><tr><td align="center" bgcolor="#015591" style="border-radius:999px;background:#015591;background-image:linear-gradient(90deg,#015591,#50C898);"><a href="${brand.app}" style="display:inline-block;color:#fff;text-decoration:none;font-size:15px;font-weight:600;line-height:1;padding:14px 26px 14px 22px;border-radius:999px;"><img src="${brand.markLogo}" width="22" height="23" alt="" style="display:inline-block;vertical-align:middle;border:0;margin:0 10px 0 0;" /><span style="display:inline-block;vertical-align:middle;">Open VersaLife</span></a></td></tr></table>`;
    const html = `<!DOCTYPE html><html><body style="margin:0;padding:0;background:#eef4f9;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a2b3c;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef4f9;padding:32px 16px;"><tr><td align="center"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;"><tr><td align="center" style="padding:8px 0 24px;"><img src="${brand.headerLogo}" width="93" alt="VersaLife Health" style="display:block;border:0;" /></td></tr><tr><td style="background:#fff;border-radius:16px;border:1px solid #d8e6f2;box-shadow:0 8px 32px rgba(1,85,145,0.08);"><table width="100%" cellspacing="0" cellpadding="0"><tr><td style="height:4px;background:linear-gradient(90deg,#015591,#50C898);">&nbsp;</td></tr><tr><td style="padding:32px 28px 8px;"><p style="margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#50C898;">${brand.product}</p><h1 style="margin:0;font-size:22px;line-height:1.35;font-weight:700;color:#015591;">${esc(subject)}</h1></td></tr><tr><td style="padding:8px 28px 28px;font-size:16px;line-height:1.65;color:#243447;">${paras}</td></tr><tr><td align="center" style="padding:0 28px 32px;">${cta}</td></tr></table></td></tr><tr><td align="center" style="padding:24px 12px 0;font-size:12px;line-height:1.6;color:#5c6b7a;"><p style="margin:0 0 8px;">You received this email because of activity on your VersaLife Health account.</p><p style="margin:0;">&copy; 2026 VersaLife Health. Telemedicine for Sri Lanka.</p></td></tr></table></td></tr></table></body></html>`;
    document.querySelector("iframe").setAttribute("srcdoc", html);
  </script>
</body>
</html>
